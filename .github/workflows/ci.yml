name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check Node.js engine requirement
        run: node ./tools/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
