<!doctype html>
<html lang="en" data-rainbow-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow — All Components</title>
  <script type="module" src="../src/auto.ts"></script>
</head>
<body style="margin:0;background:var(--rainbow-color-background);color:var(--rainbow-color-text);font-family:var(--rainbow-font-family)">
  <main style="max-width:960px;margin:auto;padding:2rem;display:grid;gap:2rem">
    <header><h1>Rainbow component gallery</h1><p>Plain HTML integration. No React, Vue, Svelte, or other framework required.</p></header>
    <section><h2>Actions</h2><div style="display:flex;gap:1rem;flex-wrap:wrap"><rainbow-button>Primary</rainbow-button><rainbow-button variant="secondary">Secondary</rainbow-button><rainbow-button variant="ghost">Ghost</rainbow-button><rainbow-button variant="danger">Danger</rainbow-button></div></section>
    <form style="display:grid;gap:1rem;max-width:36rem"><h2>Form controls</h2><rainbow-input name="email" label="Email" type="email" required placeholder="you@example.com"></rainbow-input><rainbow-textarea name="message" label="Message" rows="5"></rainbow-textarea><rainbow-select name="framework" label="Framework"><option value="react">React</option><option value="vue">Vue</option><option value="django">Django + HTMX</option></rainbow-select><rainbow-checkbox name="terms" value="accepted" label="Accept terms"></rainbow-checkbox><rainbow-button type="submit">Submit</rainbow-button></form>
  </main>
</body>
</html>
